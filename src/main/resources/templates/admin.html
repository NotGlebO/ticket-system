<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>

    <!-- Наш общий header -->
    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 100px 40px 40px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .create-form {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #f7f7f7;
        }

        .delete-button {
            background: #a22;
        }

        .delete-button:hover {
            background: #811;
        }

        .delete-selected {
            margin-top: 20px;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<!-- Общий Home/Login/Logout header -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <h1>Admin Panel</h1>

    <!-- СОЗДАНИЕ ПОЛЬЗОВАТЕЛЯ -->
    <div class="card">

        <h2>Create User</h2>

        <form
            class="create-form"
            th:action="@{/admin/users}"
            method="post">

            <input
                type="text"
                name="username"
                placeholder="Username"
                required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <select name="role">

                <option
                    th:each="role : ${roles}"
                    th:value="${role}"
                    th:text="${role}">
                </option>

            </select>

            <button type="submit">
                Create User
            </button>

        </form>

    </div>

    <!-- СПИСОК ПОЛЬЗОВАТЕЛЕЙ -->
    <div class="card">

        <h2>Users</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="user : ${users}">

                    <td th:text="${user.id}"></td>

                    <td th:text="${user.username}"></td>

                    <td th:text="${user.role}"></td>

                    <td>

                        <form
                            th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                            method="post">

                            <button
                                type="submit"
                                class="delete-button">
                                Delete
                            </button>

                        </form>

                    </td>

                </tr>

            </tbody>

        </table>

    </div>



    <div class="card">

        <h2>Tickets</h2>

        <form th:action="@{/admin/tickets/delete-selected}"
            method="post">

            <table>

                <thead>
                    <tr>
                        <th>
                            <input type="checkbox"
                                id="selectAll">
                        </th>
                        <th>Ticket</th>
                        <th>Title</th>
                        <th>User</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="ticket : ${tickets}">

                        <!-- Выбор тикета -->
                        <td>
                            <input type="checkbox"
                                name="ticketIds"
                                th:value="${ticket.id}">
                        </td>

                        <!-- Публичный номер -->
                        <td>
                            #<span th:text="${ticket.ticketNumber}">
                            </span>
                        </td>

                        <!-- Название -->
                        <td th:text="${ticket.title}">
                        </td>

                        <!-- Кто создал -->
                        <td>
                            <span th:if="${ticket.user != null}"
                                th:text="${ticket.user.username}">
                            </span>

                            <span th:if="${ticket.user == null}">
                                Guest
                            </span>
                        </td>

                        <!-- Удаление одного -->
                        <td>
                            <button type="submit"
                                    class="delete-button"
                                    th:formaction="@{/admin/tickets/{id}/delete(id=${ticket.id})}">
                                Delete
                            </button>
                        </td>

                    </tr>

                </tbody>

            </table>

            <button type="submit"
                    class="delete-button delete-selected">
                Delete Selected
            </button>

        </form>
    </div>
</div>
<script>
    const selectAll = document.getElementById("selectAll");

    selectAll.addEventListener("change", function () {

        const checkboxes =
            document.querySelectorAll('input[name="ticketIds"]');

        checkboxes.forEach(function (checkbox) {
            checkbox.checked = selectAll.checked;
        });

    });
</script>
</body>
</html>
