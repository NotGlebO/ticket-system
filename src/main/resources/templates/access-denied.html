<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .error-card {
            background: white;

            padding: 40px;

            border: 1px solid #ddd;
            border-radius: 8px;

            text-align: center;

            width: 400px;
        }

        .error-code {
            font-size: 60px;
            font-weight: bold;
            margin: 0;
        }

        .error-title {
            font-size: 24px;
            margin-top: 10px;
        }

        .error-text {
            color: #666;
            margin: 20px 0 30px;
        }

        .home-link {
            display: inline-block;

            padding: 12px 20px;

            background: #333;
            color: white;

            text-decoration: none;
            border-radius: 6px;
        }

        .home-link:hover {
            background: #555;
        }

    </style>

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>


<div class="error-card">

    <p class="error-code">
        403
    </p>

    <div class="error-title">
        Access Denied
    </div>

    <div class="error-text">
        You don't have permission to access this page.
    </div>

    <a th:href="@{/}"
       class="home-link">
        Back to Home
    </a>

</div>

</body>

</html>
