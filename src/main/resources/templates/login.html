<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 100px 40px 40px;
        }

        .container {
            max-width: 400px;
            margin: 100px auto;
        }

        .login-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .buttons {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-button {
            border: none;
            background: #222;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .back-button {
            color: #555;
            text-decoration: none;
            padding: 10px;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .error {
            color: #b00020;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="container">

    <div class="login-card">

        <h1>Login</h1>

        <p th:if="${param.error}" class="error">
            Invalid username or password
        </p>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label>Username</label>
                <input type="text"
                       name="username"
                       required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       required>
            </div>

            <div class="buttons">

                <button type="submit" class="login-button">
                    Login
                </button>

                <a href="/" class="back-button">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
