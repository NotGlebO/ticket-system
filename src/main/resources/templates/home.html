<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Ticket System</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 100px 40px 40px;
        }

        .container {
            max-width: 650px;
            margin: 100px auto 0;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 35px;
        }

        .menu {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .menu-button {
            display: inline-block;
            padding: 14px 22px;
            background: #222;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 15px;
        }

        .menu-button:hover {
            background: #444;
        }


       
    </style>
</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <h1>Ticket System</h1>

    <p class="subtitle">
        Create and manage support tickets
    </p>

    <div class="menu">

        <a href="/tickets/new" class="menu-button">
            + Create Ticket
        </a>
        <a  sec:authorize="isAuthenticated()"
            th:href="@{/my-tickets}"
            class="menu-button">
            My Tickets
        </a>

        <a  sec:authorize="hasAnyRole('IT', 'ADMIN')"
            th:href="@{/tickets}"
            class="menu-button">
                View Tickets
        </a>

    </div>

</div>

</body>
</html>
