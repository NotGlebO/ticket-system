<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">


<head>
    <meta charset="UTF-8">
    <title>Create Ticket</title>
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 100px 40px 40px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .header p {
            margin: 0;
            color: #666;
        }

        .form-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #555;
        }

        .buttons {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .submit-button {
            border: none;
            background: #222;
            color: white;
            padding: 11px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .submit-button:hover {
            background: #444;
        }

        .back-button {
            color: #555;
            text-decoration: none;
            padding: 10px;
        }

        .back-button:hover {
            text-decoration: underline;
        }

        .guest-message {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
            text-align: center;
            color: #666;
        }

        .guest-message p {
            margin-bottom: 10px;
        }

        .guest-message a {
            color: #333;
            font-weight: bold;
            text-decoration: none;
        }

        .guest-message a:hover {
            text-decoration: underline;
        }
       
    </style>
</head>

<body>
    
<div th:replace="~{fragments/header :: header}"></div>

<div class="container">

    <div class="header">
        <h1>Create Ticket</h1>
        <p>Describe your problem and we will get back to you.</p>
    </div>

    <div class="form-card">

        <form th:action="@{/tickets}" method="post">

            <div class="form-group">
                <label for="name">Your name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="John Smith"
                    maxlength="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="john@example.com"
                    maxlength="255"
                    required
                >
            </div>

            <div class="form-group">
                <label for="title">Title</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Short description of the problem"
                    maxlength="200"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    placeholder="Describe what happened..."
                    maxlength="10000"
                    required
                ></textarea>
            </div>

            <div class="buttons">

                <button
                    class="submit-button"
                    type="submit">
                    Create Ticket
                </button>

                <a class="back-button" href="/">
                    Cancel
                </a>

            </div>

        </form>
        <div sec:authorize="!isAuthenticated()"
            class="guest-message">

            <p>
                Ticket history is not saved for guests.
                Log in to keep track of your tickets.
            </p>

            <a th:href="@{/login}">
                Login
            </a>

        </div>

    </div>

</div>

</body>
</html>
